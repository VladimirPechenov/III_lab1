name: Telemetry tests
on:
  push:
    branches: [lab02-telemetry]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m ruff check server client analysis dashboard tests tools
      - run: python -m client.python_logger --simulate 48
      - run: python -m pytest
      - run: python -m analysis.analyze
      - uses: actions/upload-artifact@v4
        with:
          name: telemetry-results
          path: results/
